# Täglicher Lauf der Pipeline.
#
# SICHERHEIT (das Repo ist öffentlich, die Logs auch):
# - Dieser Workflow läuft NUR per Zeitplan oder von Hand (workflow_dispatch), NIE bei Pull Requests.
#   So kommen Forks nicht an die Secrets.
# - Das Programm gibt nur technische Zähler aus, nie Titel, Profil, Scores oder Mail-Inhalte.
name: Daily

on:
  schedule:
    - cron: "0 5 * * *"     # täglich 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Pipeline ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m src.main --real
