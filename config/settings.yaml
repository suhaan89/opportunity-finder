# Einstellungen (öffentlich, keine persönlichen Daten!)

gemini:
  model: gemini-3.1-flash-lite   # Modellname NUR hier ändern, nie im Code (2.5-flash gibt es nicht mehr)
  max_calls_per_run: 250         # Budget-Schutz: maximale Gemini-Aufrufe pro Lauf (ca. 9 s pro Aufruf, ~40 min)
  searches_per_run: 10           # Suchanfragen pro Lauf (rotierend); Tavily-Gratis: 1000/Monat
  seconds_between_calls: 4       # Pause zwischen Aufrufen (Free-Tier-Ratelimit)

fetch:
  timeout_seconds: 15
  max_chars: 12000               # so viel Seitentext bekommt Gemini höchstens
  user_agent: "opportunity-finder/1.0 (persoenliches Projekt)"

dedupe:
  title_similarity: 0.88         # ab diesem Wert (0..1) gelten zwei Titel als gleich

scoring:
  weights:                       # Summe = 1.0
    interest_fit: 0.30
    funding: 0.25
    prestige: 0.20
    career: 0.15
    network: 0.05
    feasibility: 0.05
  fully_funded_bonus: 15         # Bonus für voll finanziert + international
  extra_interests:               # zusätzlich zu den Interessen im Profil (Punkte wie dort)
    reisen_und_neue_orte_kostenlos: 40        # Workshops, Austausche, Camps an anderen Orten, Kosten übernommen
    jugendaustausch_europa_workshops: 25      # Erasmus+, SALTO, Jugendbegegnungen, Trainings (jedes Thema)
    journalismus_medien_kreatives: 10
    persoenliche_entwicklung_leadership: 15
  online_min_prestige: 85        # Online-Ausnahme
  regional_min_prestige: 80      # Regional-Ausnahme
  top_provider_prestige_floor: 90
  top_providers:                 # bekannte Top-Anbieter (Prestige mindestens der Floor-Wert)
    - Studienstiftung
    - Jugend forscht
    - Deutsche SchülerAkademie
    - Hasso-Plattner
    - DAAD
    - Google
    - MIT
    - Stanford
    - Harvard
    - ETH
    - CERN
    - Max-Planck
    - Fraunhofer

mail:
  min_score: 50                  # E-Mail-Schwelle (alles Gespeicherte steht auf der Seite)
  reminder_days: [7, 2]          # Deadline-Reminder: so viele Tage vorher

gmail:
  label: Opportunity-Finder      # nur Mails mit diesem Label werden gelesen (Phase 3)
  max_messages: 10
  newer_than_days: 3

sources:
  max_pages_per_run: 8           # so viele Quellenseiten pro Lauf (rotierend, kostet Gemini-Aufrufe)
  max_listing_follow: 12         # so viele Übersichtsseiten (Listen, Kalender) pro Lauf nach Einzel-Angeboten durchsuchen
